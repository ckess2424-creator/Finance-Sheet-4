<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💰 Finance Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="container">

<h1>💰 Finance Dashboard</h1>

<div class="tabs">
  <button onclick="app.showTab('expenses')">Expenses</button>
  <button onclick="app.showTab('balances')">Balances</button>
  <button onclick="app.showTab('payslips')">Payslips</button>
  <button onclick="app.showTab('summary')">Summary</button>
</div>

<!-- EXPENSES -->
<div id="expenses" class="tab">
  <h2>Expenses</h2>

  <select id="currency">
    <option value="usd">USD</option>
    <option value="ils">ILS</option>
  </select>

  <input type="date" id="date">
  <input type="text" id="category" placeholder="Category">
  <input type="number" id="amount" placeholder="Amount">
  <button onclick="app.addExpense()">Add</button>

  <div id="expenseList"></div>
</div>

<!-- BALANCES -->
<div id="balances" class="tab">
  <h2>Balances</h2>

  <input id="usdChecking" placeholder="USD Checking">
  <button onclick="app.updateBalance('usdChecking')">Save</button>

  <input id="usdSavings" placeholder="USD Savings">
  <button onclick="app.updateBalance('usdSavings')">Save</button>

  <input id="ils" placeholder="ILS">
  <button onclick="app.updateBalance('ils')">Save</button>
</div>

<!-- PAYSLIPS -->
<div id="payslips" class="tab">
  <h2>Payslips</h2>

  <select id="payCurrency">
    <option value="usd">USD</option>
    <option value="ils">ILS</option>
  </select>

  <input type="date" id="payDate">
  <input type="number" id="gross" placeholder="Gross">
  <input type="number" id="taxes" placeholder="Taxes">

  <button onclick="app.addPayslip()">Add Payslip</button>

  <div id="payslipList"></div>
</div>

<!-- SUMMARY -->
<div id="summary" class="tab">
  <h2>Monthly Summary</h2>
  <p id="summaryText"></p>
  <canvas id="chart"></canvas>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
